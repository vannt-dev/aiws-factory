# {req} — Plan. Mỗi task nhỏ: <= 10 file, có test riêng. Mọi TC trong 03-test-spec.md thuộc đúng 1 task.
# allowed_files: đường dẫn chính xác (hoặc glob hẹp) trong các thư mục source_paths, gồm cả file test,
#   đặt đúng cấu trúc hiện có của dự án (không tạo cấu trúc mới, không đổi tên/di chuyển file).
# type: loại commit theo Conventional Commits (feat | fix | refactor | perf | test | docs | build | chore...).
tasks:
  - id: T1
    type: feat
    title: be - ...
    description: ...
    allowed_files:
      - source-be/...
      - source-be/...test...
    tests: [TC-1]
    depends_on: []
  - id: T2
    type: feat
    title: fe - ...
    description: ...
    allowed_files:
      - source-fe/...
      - source-fe/...test...
    tests: [TC-2]
    depends_on: [T1]
