# {req} — Plan. Small tasks: <= 10 files each, with their own tests. Every TC of 03-test-spec.md belongs to exactly one task.
# allowed_files: exact paths (or narrow globs) inside the source_paths directories, test files included,
#   placed in the project's existing structure (no new structure, no renaming or moving of files).
# type: the Conventional Commits type of the task's commit (feat | fix | refactor | perf | test | docs | build | chore...).
tasks:
  - id: T1
    type: feat
    title: be - ...
    description: ...
    allowed_files:
      - source-be/...
      - source-be/...test...
    tests: [TC-1]
    depends_on: []
  - id: T2
    type: feat
    title: fe - ...
    description: ...
    allowed_files:
      - source-fe/...
      - source-fe/...test...
    tests: [TC-2]
    depends_on: [T1]
