# Chọn adapter/AI theo phase: claude (mặc định), codex, scripted. Review chéo bằng model khác: giao phase
# review cho codex (xem mục codex bên dưới).
default_adapter: claude

phases: {}
#  review: {adapter: codex}

claude:
  command: claude
  permission_mode: dontAsk      # headless: chỉ các tool trong --allowedTools được chạy
  timeout_minutes: 30
  # Lệnh hook bảo vệ. Mặc định tự chọn: workspace có sẵn aiws/adapters/cli thì chạy
  # 'node "${CLAUDE_PROJECT_DIR}/aiws/adapters/cli/bin/aiws.js" guard', còn không thì 'aiws guard' (cần `aiws` trên PATH).
  # guard_command: 'aiws guard'
  models:                       # model_hint trong aiws/agents/*.md -> model của Claude Code
    strong-reasoning: opus
    strong-coding: opus
    fast: sonnet
  # Chọn model riêng cho từng agent (ưu tiên hơn model_hint). Ví dụ giảm chi phí implementation:
  # agent_models:
  #   developer: sonnet
  # Chọn model riêng cho một phase (ưu tiên hơn agent_models), áp dụng cho mọi agent của phase đó khi chạy
  # `aiws run`. Ví dụ: agent discovery chạy model rẻ hơn khi cập nhật knowledge, nhưng `aiws discover` vẫn giữ nguyên:
  # phase_models:
  #   knowledge_update: sonnet
  extra_args: []

# Codex CLI (`codex exec`, headless) cho các phase không cần shell: review, analysis, design. Sandbox của Codex
# (read-only khi contract không ghi, workspace-write khi có) và diff-scope giữ phạm vi; không có hook guard,
# nên phase có `bash` (implementation) bị từ chối. Codex báo token chứ không báo USD: cost_usd để trống.
# codex:
#   command: codex
#   timeout_minutes: 30
#   models:                      # model_hint -> model của Codex
#     strong-reasoning: gpt-5-codex
#     strong-coding: gpt-5-codex
#     fast: gpt-5-codex
#   agent_models: {}             # ưu tiên hơn model_hint, ví dụ reviewer: gpt-5-codex
#   phase_models: {}             # ưu tiên hơn agent_models, ví dụ review: gpt-5-codex
#   extra_args: []

# `aiws run --wait`: chạy lại sau mỗi `minutes` phút khi AI hết hạn mức, tối đa `max_hours` giờ.
# wait:
#   minutes: 15
#   max_hours: 12

# Báo cho người khi run dừng (tới gate, bị chặn, chạm 80% ngân sách, tạm dừng vì hạn mức AI).
# Lệnh shell: {message}, {req}, {event} được điền; biến môi trường AIWS_NOTIFY_MESSAGE/_REQ/_EVENT/_PHASE cũng có.
# Webhook: POST JSON {text, content, req, event, phase, status}; ${VAR} lấy từ môi trường để không ghi bí mật vào git.
# notify:
#   events: [gate, blocked, budget, paused]
#   command: 'notify-send AIWS "{message}"'
#   webhook: ${AIWS_WEBHOOK_URL}

# Mở pull request nháp khi tới gate PR: orchestrator push nhánh lên `remote` rồi chạy `command`
# ({branch}, {base}, {title}, {body_file} được điền). URL cuối cùng lệnh in ra được ghi vào state.
# Lỗi (push hay lệnh) chỉ được báo; gate giữ nguyên và người tự mở pull request như trước.
# pull_request:
#   remote: origin
#   command: 'gh pr create --draft --base "{base}" --head "{branch}" --title "{title}" --body-file "{body_file}"'

# Adapter tất định để demo/test không tốn token: chạy node <dir>/<agent>.js thay cho AI.
scripted:
  dir: aiws/adapters/cli/test/fixtures/scripted
