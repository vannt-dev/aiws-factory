# Chọn adapter/AI theo phase. V1: claude. V2: codex, gemini (review chéo bằng model khác).
default_adapter: claude

phases: {}
#  review: {adapter: gemini}   # V2

claude:
  command: claude
  permission_mode: dontAsk      # headless: chỉ các tool trong --allowedTools được chạy
  timeout_minutes: 30
  # Lệnh hook bảo vệ. Mặc định tự chọn: workspace có sẵn aiws/adapters/cli thì chạy
  # 'node "${CLAUDE_PROJECT_DIR}/aiws/adapters/cli/bin/aiws.js" guard', còn không thì 'aiws guard' (cần `aiws` trên PATH).
  # guard_command: 'aiws guard'
  models:                       # model_hint trong aiws/agents/*.md -> model của Claude Code
    strong-reasoning: opus
    strong-coding: opus
    fast: sonnet
  # Chọn model riêng cho từng agent (ưu tiên hơn model_hint). Ví dụ giảm chi phí implementation:
  agent_models:
    developer: sonnet
  # Chọn model riêng cho một phase (ưu tiên hơn agent_models), áp dụng cho mọi agent của phase đó khi chạy
  # `aiws run`. Ví dụ: agent discovery chạy model rẻ hơn khi cập nhật knowledge, nhưng `aiws discover` vẫn giữ nguyên:
  # phase_models:
  #   knowledge_update: sonnet
  extra_args: []

# Adapter tất định để demo/test không tốn token: chạy node <dir>/<agent>.js thay cho AI.
scripted:
  dir: aiws/adapters/cli/test/fixtures/scripted
