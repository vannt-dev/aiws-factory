# Profile "small" (workflow.small.yaml): architect viết design, api-contract VÀ test spec trong một lần chạy.
phase: design
agent: architect
skills: [api-design, db-design, fe-conventions, be-conventions, coding-standards, unit-testing]
tools: [read, write, edit]
reads:
  - aiws/work/{req}/01-analysis.md
  - aiws/knowledge/
  - source-fe/
  - source-be/
  - source-legacy/
notes:
  - 'This requirement runs on the "small" profile: you write the test specification as well, in the same run, right after the design. There is no separate test designer.'
  - 'Every acceptance criterion of 01-analysis.md needs at least one test case (TC-n with "covers: AC-x"); the orchestrator checks it.'
outputs:
  - path: aiws/work/{req}/02-design.md
    template: 02-design.md
    required_headings: [Tổng quan, Quyết định chính, API, DB change, FE change, Migration, Rủi ro, Quyết định cần duyệt]
    required_headings_en: [Overview, Key decisions, API, DB change, FE change, Migration, Risks, Decisions to approve]
  - path: aiws/work/{req}/api-contract.yaml
    template: api-contract.yaml
    format: openapi
  - path: aiws/work/{req}/03-test-spec.md
    template: 03-test-spec.md
    required_headings: [Chiến lược, Test cases, Ma trận AC]
    required_headings_en: [Strategy, Test cases, AC matrix]
rules:
  - every_ac_has_tc
max_attempts: 3
