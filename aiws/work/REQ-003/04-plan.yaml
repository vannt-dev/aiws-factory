      - source-be/src/main/java/com/example/crm/repository/InMemoryCustomerRepository.java
      - source-be/src/test/java/com/example/crm/repository/InMemoryCustomerRepositoryTest.java
    tests: [TC-82, TC-83]
    depends_on: []

  - id: T2
    type: feat
    title: be - thêm CustomerService.updateStatus với kiểm tra trùng số khi kích hoạt lại
    description: >-
      Nhóm BE-2 (design D2 bước 3-7, D3, D4, D5). `service/CustomerService.java`: thêm
      `public Customer updateStatus(long id, String status)` kèm một dòng Javadoc tiếng Anh
      ("Sets the status of an existing customer; its name, email and phone are kept."), và MỘT hàm private đổi chuỗi
      sang `CustomerStatus` (tên `parseStatus` là gợi ý). Thứ tự trong `updateStatus` CỐ ĐỊNH:
      (1) `Customer current = get(id);` — `NotFoundException("Customer <id> not found")` TRƯỚC mọi kiểm tra khác, kể
      cả khi `status` không hợp lệ hay `null`;
      (2) đổi `status` sang `CustomerStatus`: hợp lệ là ĐÚNG hai chuỗi `ACTIVE` và `INACTIVE`, so khớp chính xác —
      KHÔNG trim, KHÔNG đổi hoa thường. Mọi giá trị khác (`null`, `""`, `"   "`, `"DELETED"`, `"active"`,
      `" ACTIVE"`) ném `ValidationException(Map.of("status", "must be ACTIVE or INACTIVE"))`. Phải xử lý `null`
      TƯỜNG MINH: `CustomerStatus.valueOf(null)` ném `NullPointerException` (thành 500), và không để lọt
      `IllegalArgumentException`;
      (3) `current.status() == target` thì `return current;` — không ghi, KHÔNG kiểm tra trùng số (AC-4);
      (4) chỉ khi `target == CustomerStatus.ACTIVE` VÀ `current.phone() != null`: nếu
      `repository.existsByPhoneAndStatusAndIdNot(current.phone(), CustomerStatus.ACTIVE, id)` thì ném
      `ValidationException(Map.of("phone", "is already used by another customer"))`;
      (5) `return repository.updateStatus(id, target).orElseThrow(() -> new NotFoundException("Customer " + id + " not found"));`.
      BẮT BUỘC: KHÔNG gọi hàm private `check`, KHÔNG gọi `PhoneNumbers` — số đang lưu đem so NGUYÊN VĂN, không trim,
      không chuẩn hoá, không kiểm tra định dạng (khách hàng có số theo quy tắc cũ `01234567890` vẫn đổi trạng thái
      được); BỎ QUA kiểm tra trùng khi `current.phone()` là `null` (truyền `null` xuống
      `existsByPhoneAndStatusAndIdNot` sẽ `NullPointerException`); chiều `INACTIVE` không có điều kiện nào; không
      kiểm tra email hay họ tên; nguyên văn hai thông điệp ở trên; mỗi lỗi là map đúng MỘT key. Service nhận `String`,
      không nhận `CustomerStatus`; không tách thành `activate`/`deactivate`; không thêm exception hay mã lỗi mới.
      `list`, `get`, `create`, `update`, `check`, record `Checked`, `PhoneNumbers.java` và hai file repository (xong
      ở T1) KHÔNG sửa; không reformat phần không liên quan.
      Test: thêm TC-84..TC-90 vào `CustomerServiceTest.java` theo đúng preconditions và bảng dữ liệu trong
      03-test-spec.md, thành một khối liền nhau. Dùng field `repository` và `service` của `@BeforeEach` có sẵn
      (KHÔNG tạo repository cục bộ như TC-25); dựng dữ liệu bằng `repository.insert(...)` theo đúng thứ tự của
      preconditions (thứ tự quyết định `id`; Seed `ACTIVE` không có số luôn là id 1); TC-88 dùng helper có sẵn
      `insertSeedAndAn()`. Mỗi dòng dữ liệu chạy trên kho mới. "Không đổi gì" = `service.list()` bằng đúng danh
      sách chụp trước khi gọi; kết quả ghi so cả record rồi đọc lại bằng `service.get(id)`; lỗi validation so cả
      map `errors()`. Bảng dữ liệu theo cách của class này: `@ParameterizedTest(name = ROW_NAME)` + `@MethodSource`
      với provider `private static` đặt ngay sau test và `arguments(...)` import static; ca `null` của bảng một cột
      (TC-88) dùng `@NullSource`; TC-89 chạy MỖI giá trị `status` với cả `current = ACTIVE` và `current = INACTIVE`
      (16 dòng). `@DisplayName("TC-n: ...")` ở mức method bằng câu tiếng Anh; tên method camelCase, không chứa mã TC.
      Test cũ (TC-13..TC-26, TC-48..TC-60 và 5 test không mã TC) KHÔNG sửa và phải pass.
    allowed_files:
      - source-be/src/main/java/com/example/crm/service/CustomerService.java
      - source-be/src/test/java/com/example/crm/service/CustomerServiceTest.java
    tests: [TC-84, TC-85, TC-86, TC-87, TC-88, TC-89, TC-90]
    depends_on: [T1]

  - id: T3
    type: feat
    title: "be - thêm endpoint PUT /api/customers/{id}/status đổi trạng thái khách hàng"
    description: >-
      Nhóm BE-3 (design D1, D2 bước 1-2, D4, D7; api-contract.yaml -> `updateCustomerStatus`). Tạo
      `api/UpdateCustomerStatusRequest.java`: `public record UpdateCustomerStatusRequest(String status) {}` với
      Javadoc một dòng "Request body of PUT /api/customers/{id}/status.". Field BẮT BUỘC là `String`, KHÔNG phải
      `CustomerStatus`: với enum, Jackson biến `"DELETED"`/`""` thành 400 `Malformed JSON` trước cả bước tìm khách
      hàng (sai D2, D4).
      `api/CustomerHandler.java`: thêm hằng
      `private static final Pattern STATUS_BY_ID = Pattern.compile("^/api/customers/(\\d+)/status$");` cạnh `BY_ID`.
      Trong `route`, SAU hai khối của `BY_ID` và TRƯỚC fallback, thêm một `Matcher` của `STATUS_BY_ID` và MỘT khối
      `if (statusById.matches() && method.equals("PUT")) { ...; return; }`: đọc body bằng
      `JSON.readValue(exchange.getRequestBody(), UpdateCustomerStatusRequest.class)` TRƯỚC khi gọi service (JSON
      hỏng trả 400 `Malformed JSON` kể cả khi `id` không tồn tại), rồi
      `send(exchange, 200, service.updateStatus(Long.parseLong(statusById.group(1)), body.status()))`.
      `id` chỉ lấy từ path; field khác trong body đã bị bỏ qua nhờ `FAIL_ON_UNKNOWN_PROPERTIES = false`. Handler
      KHÔNG kiểm tra hay đổi kiểu `status` (validation nằm ở service). Cập nhật Javadoc của class để liệt kê thêm
      `PUT /api/customers/{id}/status`.
      KHÔNG nới `BY_ID` (không `(/status)?`), không thêm `GET` hay method khác trên path này (rơi vào fallback
      `No route for <METHOD> <path>` có sẵn), không thêm mã lỗi, `title` hay dòng map exception mới. `handle`,
      `send`, `BY_ID`, `JSON` và bốn route cũ không đổi. Không xử lý riêng `id` vượt `long`, body JSON `null`,
      `status` không phải chuỗi (design R11) và KHÔNG viết test cho ba đầu vào này.
      Không sửa: `App.java` (context `/api/customers` đã bao cả path con), `CreateCustomerRequest.java`,
      `UpdateCustomerRequest.java`, `Problem.java`, `CustomerService.java`, repository.
      Test: thêm TC-91..TC-100 vào `CustomerHandlerTest.java` theo đúng preconditions và bảng dữ liệu trong
      03-test-spec.md, thành một khối liền nhau. Dùng NGUYÊN các helper có sẵn `get(path)`, `post(json)`,
      `put(path, json)`, `customers()`, `errorsOf(body)` — KHÔNG thêm helper; `path` tính từ `/api/customers`, ví dụ
      `put("/2/status", "{\"status\":\"INACTIVE\"}")`. Server và seed id 1 (`ACTIVE`, không có số) lấy từ
      `@BeforeEach` có sẵn; khách hàng khác tạo bằng `post(...)`; khách hàng `INACTIVE` dựng qua CHÍNH endpoint mới.
      Parse response bằng `CustomerHandler.JSON.readTree`. "Không đổi gì" = `customers()` (so `JsonNode`) bằng đúng
      giá trị chụp trước yêu cầu (TC-93 chụp SAU bước 3 của preconditions). Lỗi validation so cả map bằng
      `errorsOf(body)`. TC-95 gửi cùng request HAI lần liên tiếp. Bảng dữ liệu theo cách của class này:
      `@ParameterizedTest(name = "[{index}]")` + `@MethodSource` với `Arguments.of(...)`, provider `private static`
      đặt ngay sau test; không chạy nhiều dòng dữ liệu nối tiếp trong một `@Test`.
      `@DisplayName("TC-n: ...")` ở mức method bằng câu tiếng Anh; tên method camelCase, không chứa mã TC.
      Test cũ (TC-27..TC-32, TC-61..TC-69 và 4 test không mã TC) KHÔNG sửa và phải pass.
    allowed_files:
      - source-be/src/main/java/com/example/crm/api/UpdateCustomerStatusRequest.java
      - source-be/src/main/java/com/example/crm/api/CustomerHandler.java
      - source-be/src/test/java/com/example/crm/api/CustomerHandlerTest.java
    tests: [TC-91, TC-92, TC-93, TC-94, TC-95, TC-96, TC-97, TC-98, TC-99, TC-100]
    depends_on: [T2]

  - id: T4
