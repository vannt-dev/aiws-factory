  - id: T5
    type: feat
    title: fe - thêm nút đổi trạng thái vào ô Thao tác của bảng khách hàng
    description: >-
      Nhóm FE-2 (design D9, R7). `src/components/customerTable.js`: thêm một hằng cạnh `STATUS_LABELS` mang trạng
      thái đích và nhãn nút, ví dụ
      `STATUS_ACTIONS = { ACTIVE: { target: 'INACTIVE', label: 'Ngừng hoạt động' }, INACTIVE: { target: 'ACTIVE', label: 'Kích hoạt lại' } }`
      (tên hằng là gợi ý). Trong ô "Thao tác" ĐANG CÓ, ngay sau nút "Sửa" và cách nó ĐÚNG MỘT dấu cách, thêm một
      nút đổi trạng thái. HTML viết liền, đúng thứ tự thuộc tính `type`, `data-status-id`, `data-target-status`:
      khách hàng `ACTIVE`:
      `<td><button type="button" data-edit-id="1">Sửa</button> <button type="button" data-status-id="1" data-target-status="INACTIVE">Ngừng hoạt động</button></td>`;
      khách hàng `INACTIVE`:
      `<td><button type="button" data-edit-id="2">Sửa</button> <button type="button" data-status-id="2" data-target-status="ACTIVE">Kích hoạt lại</button></td>`.
