      và mọi assertion khác của nó. TC-74 không nằm trong `tests` của task này vì thuộc REQ-002. Mọi test khác
      trong file (3 test không mã TC, TC-36..TC-41, TC-75) không sửa và phải pass.
      Thêm TC-103, TC-104, TC-105 theo 03-test-spec.md thành một khối liền nhau, so chuỗi HTML bằng
      `assert.match`/`assert.doesNotMatch` và đếm bằng `html.match(/.../g).length`; bảng dữ liệu của TC-104, TC-105
      là một mảng lặp bằng `for...of` trong MỘT `test(...)`. Tên test `test('TC-n: renderCustomerTable ...', ...)`
      bằng câu tiếng Anh.
