    title: fe - thêm updateCustomerStatus vào customerApi
    description: >-
      Nhóm FE-1 (design D8; api-contract.yaml -> `updateCustomerStatus`). `src/api/customerApi.js`: thêm MỘT hàm
      public đi qua `request()` có sẵn, kèm một dòng JSDoc `/** ... */` tiếng Anh, đặt sau `updateCustomer`:
      `updateCustomerStatus(id, status, options)` trả
      ``request(`/customers/${encodeURIComponent(id)}/status`, { ...options, method: 'PUT', body: JSON.stringify({ status }) })``.
      Body là ĐÚNG `{ status }`: không thêm `id` hay field khác. Hàm KHÔNG kiểm tra giá trị `status` và trả khách
      hàng mà API trả; lỗi non-2xx ném `ApiError` qua `request()`. `request`, `ApiError`, `API_BASE` và bốn hàm cũ
      KHÔNG sửa. Không tách thành hai hàm `activateCustomer`/`deactivateCustomer`.
      Test: thêm TC-101, TC-102 vào `test/customerApi.test.js` bằng `fakeFetch` có sẵn (bổ sung
      `updateCustomerStatus` vào dòng import), thành một khối liền nhau. Bảng dữ liệu là một mảng, lặp bằng
      `for...of` trong MỘT `test(...)`; mỗi dòng dùng mảng `calls` mới. TC-101 kiểm `calls.length`, `calls[0].url`,
