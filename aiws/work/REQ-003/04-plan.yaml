# REQ-003 — Plan. Mỗi task nhỏ: <= 10 file, có test riêng. Mọi TC trong 03-test-spec.md thuộc đúng 1 task.
# allowed_files: đường dẫn chính xác (hoặc glob hẹp) trong các thư mục source_paths, gồm cả file test,
#   đặt đúng cấu trúc hiện có của dự án (không tạo cấu trúc mới, không đổi tên/di chuyển file).
# type: loại commit theo Conventional Commits (feat | fix | refactor | perf | test | docs | build | chore...).
#
# Chia theo nhóm biên dịch của 02-design.md (BE change -> BE-1/BE-2/BE-3, FE change -> FE-1/FE-2/FE-3) và bảng
# "Phân bổ TC theo file và nhóm task" của 03-test-spec.md. Sau mỗi task orchestrator chạy toàn bộ `be_test`
# hoặc `fe_test` của side bị chạm, nên mọi trạng thái trung gian phải biên dịch và pass cả test cũ: mỗi task
# BE chỉ THÊM public API (`InMemoryCustomerRepository` là bản cài đặt duy nhất của `CustomerRepository`, kể cả
# trong test, nên T1 tự đứng được), và TC-74 của REQ-002 được sửa trong chính task đổi `customerTable.js` (T5).
# Thứ tự: BE trước FE (design -> Migration: deploy BE trước, FE sau).
# TC-74 thuộc REQ-002, không được định nghĩa lại trong 03-test-spec.md của REQ-003, nên KHÔNG nằm trong `tests`
# của task nào (design D9, R8).
# `source-fe/src/main.js` không có TC tự động (không có DOM); nó đi cùng T6 là nhóm có test, và được kiểm bằng
# review hoặc chạy tay theo mục "Không có TC tự động" của 03-test-spec.md.
tasks:
  - id: T1
    type: feat
    title: be - thêm thao tác ghi updateStatus chỉ đổi status vào repository
    description: >-
      Nhóm BE-1 (design D6). Chỉ THÊM một method, không đổi method cũ.
      `repository/CustomerRepository.java`: thêm
      `Optional<Customer> updateStatus(long id, CustomerStatus status)` kèm một dòng Javadoc tiếng Anh theo mẫu của
      `update` (thay `status` của khách hàng `id`; giữ `id`, `name`, `email`, `phone`; không bao giờ thêm mới). Tám
      method cũ giữ nguyên chữ ký và Javadoc.
      `repository/InMemoryCustomerRepository.java`: cài đặt đúng theo mẫu `computeIfPresent` của `update`:
      `Optional.ofNullable(customers.computeIfPresent(id, (key, c) -> new Customer(c.id(), c.name(), c.email(), c.phone(), status)))`.
      BẮT BUỘC: `id`, `name`, `email`, `phone` chép từ giá trị `c` ĐANG NẰM TRONG MAP (kể cả `phone = null`), không
      nhận từ tham số; `id` không có thì trả `Optional.empty()` và KHÔNG BAO GIỜ thêm mới (không dùng
      `customers.put`/`compute`/upsert, không đụng `sequence`); hàm truyền vào `computeIfPresent` phải thuần.
      Repository không quyết định nghiệp vụ: không kiểm tra trùng số, không so trạng thái đang có, ghi cả khi giá
      trị không đổi. Không thêm tham số `status` vào `update(id, name, email, phone)`, không thêm `save(Customer)`.
      Không sửa file nào khác: `CustomerService` chưa gọi method này (việc của T2); mọi test cũ phải biên dịch và
      pass không đổi.
      Test: thêm TC-82, TC-83 vào `InMemoryCustomerRepositoryTest.java` theo đúng preconditions và bảng dữ liệu
      trong 03-test-spec.md, thành một khối liền nhau; TC-11, TC-12, TC-44..TC-47 giữ nguyên. Mỗi test tự tạo
      `InMemoryCustomerRepository` mới; thứ tự `insert` quyết định `id` (TC-82: Other là id 1, khách hàng đang đổi
      là id 2; TC-83 chụp `findAll()` trước khi gọi). TC-82 so cả record trả về, `findById(2)` và cả `findAll()`.
      Bảng dữ liệu theo cách của class này: `@ParameterizedTest` trần (tên mặc định) + `@MethodSource` với provider
      `private static` đặt ngay sau test và `arguments(...)` import static (TC-82 có dòng `phone = null`);
      TC-83 là bảng một cột toàn hằng nên dùng `@ValueSource(longs = {999, 0, 2})` như TC-45.
      `@DisplayName("TC-n: ...")` ở mức method bằng câu tiếng Anh; tên method camelCase, không chứa mã TC.
      Arrange-Act-Assert.
    allowed_files:
