  - id: T6
    type: feat
    title: fe - thêm describeStatusError và nối nút đổi trạng thái vào trang
    description: >-
      Nhóm FE-3 (design D10, D11). Tạo `src/utils/describeStatusError.js`: JSDoc một dòng tiếng Anh,
      `export function describeStatusError(error)` là hàm thuần trả CHUỖI TEXT THUẦN (không phải HTML).
      `error?.fieldErrors?.phone` có giá trị thì trả
      `'Không kích hoạt lại được: số điện thoại đang được một khách hàng đang hoạt động khác dùng.'`; mọi trường hợp
      khác (`ApiError` 404/500/502, 400 chỉ có `errors.status`, `TypeError` mất mạng, `null`, `undefined`) trả
      `'Không đổi được trạng thái khách hàng.'`. Hai câu là hằng `UPPER_SNAKE_CASE` trong file, đúng nguyên văn.
      File KHÔNG import gì: nhận biết lỗi bằng hình dạng (`fieldErrors.phone`), KHÔNG dùng `instanceof ApiError`;
      hàm không được ném lỗi với `null`/`undefined`. Không đặt hàm này trong `src/components/`, không trả nguyên
      văn thông điệp tiếng Anh của API.
      `src/main.js`: import thêm `updateCustomerStatus` (từ `./api/customerApi.js`) và `describeStatusError` (từ
      `./utils/describeStatusError.js`, đường dẫn tương đối có đuôi `.js`); thêm MỘT listener `click` MỚI trên
      `#customers` (`listEl`) bằng delegation: `event.target.closest('button[data-status-id]')`, không có thì
      `return`; xoá `#message` (`messageEl.textContent = ''`); trong `try` gọi
      `await updateCustomerStatus(button.dataset.statusId, button.dataset.targetStatus)` rồi `await refresh()`;
      trong `catch (error)` gán `messageEl.textContent = describeStatusError(error)`. Thành công thì tải lại cả
      danh sách; thất bại thì KHÔNG gọi `refresh()`. Không có hộp thoại xác nhận, không vô hiệu hoá nút, không giữ
      state, không đụng `#edit-customer`. `refresh()` và bốn listener hiện có (kể cả listener `click` của nút
      "Sửa") KHÔNG đổi: không gộp nút mới vào listener của nút "Sửa".
