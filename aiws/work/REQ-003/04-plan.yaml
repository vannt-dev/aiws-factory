      đổi. Không biến ô "Trạng thái" thành nút, không sửa `index.html`, không gắn sự kiện ở đây (việc của `main.js`
      trong T6).
      `test/customerTable.test.js`: PHẢI sửa TC-74 của REQ-002 trong chính task này, nếu không `fe_test` fail. Sửa
      ĐÚNG hai assertion là hai regex khớp nguyên dòng của khách hàng 1 và khách hàng 2: phần ô "Thao tác" đổi từ
