  - id: T3
    type: feat
    title: "be - GET /api/customers lọc theo tham số query status"
    description: >-
      Nhóm BE-3 (design D1, D3; api-contract.yaml), phụ thuộc T2 (gọi `service.list(List<String>)`).
      `api/CustomerHandler.java`: trong khối route `GET /api/customers` (dòng 53-56), đổi dòng gọi service
      thành
      `send(exchange, 200, service.list(queryValues(exchange.getRequestURI().getRawQuery(), "status")));`
      (giữ `return;` sau đó). Thêm MỘT hàm private static mới, đúng theo hình dạng của D3:
      ```
      private static List<String> queryValues(String rawQuery, String name) {
        List<String> values = new ArrayList<>();
        if (rawQuery == null) {
          return values;
        }
        for (String pair : rawQuery.split("&")) {
          int separator = pair.indexOf('=');
          String rawName = separator < 0 ? pair : pair.substring(0, separator);
          String rawValue = separator < 0 ? "" : pair.substring(separator + 1);
          if (URLDecoder.decode(rawName, StandardCharsets.UTF_8).equals(name)) {
            values.add(URLDecoder.decode(rawValue, StandardCharsets.UTF_8));
          }
        }
        return values;
      }
      ```
      BẮT BUỘC: dùng `getRawQuery()`, TÁCH theo `&` rồi tại dấu `=` ĐẦU TIÊN TRƯỚC, GIẢI MÃ tên và giá trị
      SAU (không dùng `getQuery()`, không giải mã trước khi tách — `%26`/`%3D` trong một giá trị phải KHÔNG bị
      hiểu thành dấu tách); đoạn không có dấu `=` (`?status`) cho giá trị CHUỖI RỖNG, không phải vắng mặt;
      không có query, query rỗng, hoặc không đoạn nào tên `status` thì trả danh sách RỖNG (không gọi
      `parseStatus`/ném exception ở đây); so tên CHÍNH XÁC sau khi giải mã, phân biệt hoa thường; giữ ĐỦ mọi
      lần xuất hiện theo đúng thứ tự (không bỏ trùng, không lấy phần tử đầu/cuối). Handler KHÔNG tự ném
      `ValidationException`, KHÔNG so giá trị với `ACTIVE`/`INACTIVE` — việc đó của `service.list` (T2). Thêm
      import `java.net.URLDecoder`, `java.nio.charset.StandardCharsets`, `java.util.ArrayList` (thêm `List`
      nếu chưa có). Cập nhật Javadoc của class, thêm ví dụ tham số lọc (ví dụ
      "GET /api/customers (optional ?status=ACTIVE|INACTIVE)"). KHÔNG đổi `handle`, `send`, `BY_ID`,
      `STATUS_BY_ID` hay bốn khối route còn lại — các route đó không đọc query string, nên
      `?status=...` trên chúng vẫn bị bỏ qua như trước.
      Không sửa file nào khác (domain, service, repository đã xong ở T1/T2; `App.java` không đổi).
      Test: thêm TC-120..TC-124 vào `CustomerHandlerTest.java` theo đúng preconditions và bảng dữ liệu trong
      03-test-spec.md, thành một khối liền nhau. Dùng NGUYÊN các helper có sẵn `get(path)`, `post(json)`,
      `put(path, json)`, `customers()`, `errorsOf(body)`; `path` nối vào `/api/customers`
      (`get("?status=ACTIVE")`). Kho K4 (bốn khách hàng chuẩn, xem "Dữ liệu chung" trong spec) dựng qua CHÍNH
      API: `post` khách hàng 2, 3, 4 (mỗi lần 201) rồi `put("/2/status", "{\"status\":\"INACTIVE\"}")` và
      `put("/4/status", ...)` (mỗi lần 200); gom thành một helper `private` dùng chung cho TC-120 và TC-122
      (tên do developer chọn). Dấu cách trong URL viết `%20` (`URI.create` không nhận dấu cách thô).
      TC-120 (15 dòng theo bảng): mọi dòng 200, body là mảng đúng `id` mong đợi theo thứ tự, mỗi phần tử bằng
