  - id: T5
    type: feat
    title: fe - bộ lọc trạng thái trên trang danh sách khách hàng
    description: >-
      Nhóm FE-2 (design D7, D8, D9), phụ thuộc T4 (gọi `listCustomers({ status })` với chữ ký mới).
      Tạo `src/utils/createCustomerListLoader.js` (không import gì), đúng theo hình dạng của D8:
      ```
      export function createCustomerListLoader(listCustomers, getStatus) {
        let latest = 0;
        return async () => {
          const call = ++latest;
          try {
            const customers = await listCustomers({ status: getStatus() });
            return call === latest ? { current: true, customers } : { current: false };
          } catch (error) {
            if (call === latest) throw error;
            return { current: false };
          }
        };
      }
      ```
      kèm một dòng JSDoc tiếng Anh. BẮT BUỘC: `getStatus()` gọi đúng MỘT lần BÊN TRONG mỗi lần gọi hàm trả
      về (không lúc tạo, không lưu lại giữa các lần); bộ đếm tăng TRƯỚC khi gọi API, so `call === latest`
      SAU khi API trả về/lỗi; hai loader tạo bằng hai lời gọi riêng KHÔNG chung state (state trong closure,
      không ở mức module, không `class`); kết quả API được trả NGUYÊN (`customers` chính là giá trị API trả,
      kể cả `null`, `[]`); lỗi của lần tải KHÔNG bị vượt reject với CHÍNH lỗi đó, lần bị vượt (dù trả về hay
      lỗi) luôn `{ current: false }`, không reject. Tên file, tên export, thứ tự hai tham số và hình dạng kết
      quả (`{ current: true, customers }` / `{ current: false }`) là CỐ ĐỊNH.
      `index.html`: thêm đúng theo D7, đặt GIỮA `#edit-customer` và `#customers`:
      ```
      <p>
        <label for="status-filter">Lọc theo trạng thái</label>
        <select id="status-filter" autocomplete="off">
          <option value="" selected>Tất cả</option>
          <option value="ACTIVE">Đang hoạt động</option>
          <option value="INACTIVE">Ngừng hoạt động</option>
        </select>
      </p>
      ```
      Đúng ba `<option>`, đúng thứ tự, đúng `value` và nhãn; NẰM NGOÀI `#customers`, NGOÀI `#edit-customer` và
      NGOÀI mọi `<form>` (kể cả `#create-form`, vì `form.reset()` sau khi thêm khách hàng không được đụng tới
      nó); có `autocomplete="off"`. Có thể thêm `select` vào luật CSS `input, select { ... }` đã có (dòng 13);
      không đổi luật CSS nào khác.
      `src/main.js`: import `createCustomerListLoader`; thêm `const filterEl =
      document.getElementById('status-filter');` và tạo loader MỘT LẦN ở mức module (cạnh `listEl`,
      `messageEl`, `acceptStatusClick`), KHÔNG tạo trong `refresh()`:
      `const loadCustomers = createCustomerListLoader(listCustomers, () => filterEl.value);`. Đổi `refresh()`
      thành:
      ```
      async function refresh() {
        try {
          const { current, customers } = await loadCustomers();
          if (current) listEl.innerHTML = renderCustomerTable(customers);
        } catch {
          listEl.textContent = 'Không tải được danh sách khách hàng.';
        }
      }
      ```
      (câu lỗi và việc ghi vào `#customers` giữ nguyên như hiện nay; `refresh()` không đổi giá trị của
      `filterEl`, không xoá `#message`). Thêm listener:
      `filterEl.addEventListener('change', () => { messageEl.textContent = ''; refresh(); });` (xoá
      `#message` trước, không đụng `#edit-customer`). Ngay TRƯỚC lời gọi `refresh()` cuối file, thêm
      `filterEl.value = '';` rồi gọi `refresh();` (D7, Q8: trang luôn mở ở "Tất cả" kể cả khi trình duyệt
      khôi phục giá trị cũ). BẮT BUỘC: `getStatus` là `() => filterEl.value` — đọc điều khiển MỖI LẦN được
      gọi, KHÔNG gán `filterEl.value` vào biến ở mức module hay đầu một handler. Không đổi submit của
      `#create-form`, hai listener `click` trên `#customers`, hai listener trên `#edit-customer`,
      `acceptStatusClick` và key của nó, hay việc thao tác thất bại không tải lại danh sách.
      `src/components/customerTable.js`, `src/api/customerApi.js`, `src/utils/createDoubleClickGuard.js`,
      `src/utils/describeStatusError.js` và mọi file test khác CỐ Ý không nằm trong allowed_files; nếu thấy
      cần sửa thì ghi câu hỏi vào `aiws/work/REQ-005/questions.md` và dừng.
      Test: tạo `test/createCustomerListLoader.test.js` với TC-128..TC-134 theo đúng preconditions và bảng
      hành vi/dữ liệu trong 03-test-spec.md (`node:test` + `node:assert/strict`, import
      `createCustomerListLoader` từ `../src/utils/createCustomerListLoader.js`; KHÔNG `fetch`, không DOM,
      không timer). Mỗi dòng dữ liệu dùng loader mới (trừ khi spec nói khác), với `calls` và bộ đếm
      `getStatus` mới. `getStatus` giả: trả giá trị của một biến `selected` mà test gán lại, đếm số lần được
      gọi. `listCustomers` giả: ghi tham số nhận được vào `calls`, trả promise DO TEST ĐIỀU KHIỂN (deferred,
      `Promise.withResolvers()` hoặc tự dựng bằng `new Promise`). Với lần `load` mong đợi bị reject: gắn
      `assert.rejects(promise, ...)` TRƯỚC khi cho API của lần đó lỗi, giữ promise rồi `await` sau (tránh
      unhandled rejection).
      TC-128 (3 chuỗi lựa chọn nối tiếp): mỗi lần `load` gọi `getStatus()` đúng 1 lần và `listCustomers` đúng
      1 lần với `{ status: s }`; mọi lần đều `current: true`.
      TC-129 (4 dòng: lựa chọn lúc tạo khác lựa chọn lúc tải): `getStatus` không gọi lúc tạo hay trước lần
      tải đầu (0 lần); mỗi lần tải mang giá trị ĐANG CÓ lúc gọi `load`, không phải lúc tạo hay lần tải trước;
      đổi `selected` sau khi `load()` được gọi (yêu cầu còn chờ) KHÔNG làm đổi yêu cầu đó (`'CHANGED'` không
      bao giờ xuất hiện trong `calls`).
      TC-130 (4 dòng, gồm dòng `null`): lần tải không bị vượt trả `{ current: true, customers: <nguyên giá
      trị API trả> }` — không lọc, không sắp xếp, `result.customers` CÙNG THAM CHIẾU với mảng test trao cho
      `listCustomers` giả (`assert.equal`), kể cả `null`.
      TC-131 (2 dòng lỗi): lần tải lỗi (không bị vượt) reject với CHÍNH lỗi đó (`assert.equal`); lần tải kế
      tiếp vẫn chạy bình thường và `calls` đủ hai lời gọi đúng tham số.
      TC-132 (4 kịch bản thứ tự response): chỉ lần `load` được GỌI sau cùng là `current: true` với
      `customers` của chính nó, bất kể thứ tự response về; mọi lần khác `{ current: false }` đúng
      (`assert.deepEqual`, không mang `customers`).
      TC-133 (4 dòng): lần bị vượt luôn `{ current: false }`, KHÔNG reject dù API của nó lỗi; lần mới nhất
      reject với CHÍNH lỗi của nó (không phải lỗi của lần cũ), dù lần cũ thành công hay lỗi.
      TC-134: hai loader tạo bằng hai lời gọi riêng không chung state — lần tải đang chờ của loader thứ nhất
      vẫn `current: true` dù loader thứ hai được gọi và trả về trước.
