  - id: T6
    type: feat
    title: fe - thông báo sau khi thêm khách hàng không khớp lựa chọn lọc
    description: >-
      Nhóm FE-4 (design D5, D6), phụ thuộc T5 (cùng sửa `source-fe/src/main.js`, phải nối tiếp — xem đầu
      file). AC-4: sau khi thêm thành công, hiện "Đã thêm khách hàng." khi và chỉ khi đang lọc và khách hàng
      mới không khớp lựa chọn đang chọn.
      Tạo `source-fe/src/utils/describeCreateNotice.js` (không import gì):
      ```
      const CREATED_MESSAGE = 'Đã thêm khách hàng.';

      /** Chooses the notice shown after a customer was created: the "added" sentence when the selected
       * status filter hides the new customer, an empty string otherwise. */
      export function describeCreateNotice(created, statusFilter) {
        return statusFilter && created?.status !== statusFilter ? CREATED_MESSAGE : '';
      }
      ```
      BẮT BUỘC:
      - Dùng `created?.status` (không ném `TypeError` khi `created` là `null`/`undefined`).
