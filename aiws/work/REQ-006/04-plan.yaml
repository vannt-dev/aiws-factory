  - id: T4
    type: feat
    title: fe - câu trạng thái rỗng theo lựa chọn lọc
    description: >-
      Nhóm FE-2 (design D1, D2). AC-1: khi danh sách rỗng, câu hiển thị tuỳ theo lựa chọn lọc của đúng lần
      tải được vẽ.
      `source-fe/src/components/customerTable.js`: đổi chữ ký thành
      `export function renderCustomerTable(customers, statusFilter = '')`, thêm hai hằng cạnh `NO_PHONE`:
      ```
      const EMPTY_MESSAGE = 'Chưa có khách hàng.';
      const NO_MATCH_MESSAGE = 'Không có khách hàng nào khớp lựa chọn lọc.';
      ```
      và đổi dòng rỗng (dòng 13) thành
      `if (!customers.length) return \`<p>${statusFilter ? NO_MATCH_MESSAGE : EMPTY_MESSAGE}</p>\`;`.
      BẮT BUỘC:
      - `renderCustomerTable([])` (một tham số) vẫn trả đúng `<p>Chưa có khách hàng.</p>`; test không mã TC
        `renderCustomerTable shows an empty state` (dòng 25-27) KHÔNG sửa và phải pass.
      - `statusFilter` chỉ dùng để chọn câu, KHÔNG chèn vào HTML (hai câu là hằng, không escape).
      - Câu "không khớp" áp cho MỌI giá trị truthy của `statusFilter` (không chỉ `ACTIVE`/`INACTIVE`), kể cả
        khi kho hoàn toàn rỗng.
      - Dòng dựng bảng (dòng 14-28) KHÔNG đổi một ký tự; TC-36..TC-41, TC-74, TC-75, TC-103..TC-105, TC-114
        KHÔNG sửa và phải pass.
      - `statusFilter` không ảnh hưởng gì khi `customers` không rỗng: kết quả giống từng ký tự với lời gọi
        không truyền `statusFilter`.
      `source-fe/src/main.js`, trong `refresh()` (dòng 16-23): thêm `const statusFilter = filterEl.value;`
      làm dòng đầu tiên của hàm, TRƯỚC `try`, và trao giá trị này cho `renderCustomerTable`:
      ```
      async function refresh() {
        const statusFilter = filterEl.value;
        try {
          const { current, customers } = await loadCustomers();
          if (current) listEl.innerHTML = renderCustomerTable(customers, statusFilter);
        } catch {
          listEl.textContent = 'Không tải được danh sách khách hàng.';
        }
      }
      ```
      BẮT BUỘC:
      - Dòng đọc `filterEl.value` nằm TRONG `refresh()`, trước `await loadCustomers()`, không có `await` nào
        ở giữa; KHÔNG đưa biến này lên mức module (nới có chủ ý, đúng một biến cục bộ, của lệnh cấm
        "không gán filterEl.value vào một biến" ở `aiws/work/REQ-005/02-design.md` D9 — xem D2, R12).
      - `getStatus` của loader vẫn là `() => filterEl.value`; `src/utils/createCustomerListLoader.js` và
        TC-128..TC-134 KHÔNG đổi.
      - `if (current)`, nhánh `catch` và câu lỗi giữ nguyên; `refresh()` vẫn không xoá `#message`.
      - Không đổi gì khác trong `main.js` ở task này (import, listener nút đổi trạng thái, submit form thêm
        là việc của T5, T6).
      Test: thêm vào `source-fe/test/customerTable.test.js`, thành khối liền nhau:
      TC-135 (3 dòng dữ liệu `statusFilter`: `'ACTIVE'`, `'INACTIVE'`, `'DELETED'`): `renderCustomerTable([],
      statusFilter)` đúng bằng (`assert.equal`) `'<p>Không có khách hàng nào khớp lựa chọn lọc.</p>'` ở cả
      ba dòng.
      TC-136 (4 dòng dữ liệu `statusFilter`: không truyền, `''`, `'ACTIVE'`, `'INACTIVE'`, trên cùng một
      khách hàng `{ id: 1, name: 'Nguyen Van An', email: 'an@example.com', phone: null, status: 'ACTIVE' }`):
      `renderCustomerTable(customers, statusFilter)` đúng bằng từng ký tự (`assert.equal`) với
      `renderCustomerTable(customers)` (không truyền `statusFilter`) ở mọi dòng; không chuỗi nào chứa
      `'Chưa có khách hàng.'` hay `'Không có khách hàng nào khớp lựa chọn lọc.'`.
      Mảng dữ liệu, lặp bằng `for...of` trong một `test(...)`, không `describe`.
    allowed_files:
      - source-fe/src/components/customerTable.js
      - source-fe/test/customerTable.test.js
      - source-fe/src/main.js
    tests: [TC-135, TC-136]
    depends_on: []

  - id: T5
    type: feat
    title: fe - chống bấm đúp theo lựa chọn lọc
    description: >-
      Nhóm FE-3 (design D3, D4), phụ thuộc T4 (cùng sửa `source-fe/src/main.js`, phải nối tiếp — xem đầu
      file). AC-2, AC-3: khi đang lọc, mọi nút đổi trạng thái dùng chung một key của guard; khi xem "Tất cả",
      key vẫn là `id` khách hàng (REQ-004, không đổi).
      Tạo `source-fe/src/utils/chooseStatusClickKey.js` (không import gì):
      ```
      const ANY_CUSTOMER = Symbol('any customer');

      /** Chooses the double-click guard key of a status button: one key shared by all customers while a
       * status filter is selected, the customer id otherwise. */
      export function chooseStatusClickKey(statusFilter, customerId) {
        return statusFilter ? ANY_CUSTOMER : customerId;
      }
      ```
      BẮT BUỘC:
      - Key chung KHÔNG phải chuỗi (một `Symbol` ở mức module của file), để chắc không trùng `customerId`
        nào (`button.dataset.statusId` luôn là chuỗi, có thể là chuỗi bất kỳ).
      - Cùng MỘT key cho mọi khách hàng và cho cả hai lựa chọn lọc (`ACTIVE`, `INACTIVE`).
      - Khi `statusFilter` falsy (`''`, `undefined`, `null`), trả CHÍNH `customerId` nhận vào, không đổi
        kiểu, không thêm tiền tố.
      - Hàm thuần: không import, không state, không DOM, không đồng hồ. Thứ tự tham số
        `(statusFilter, customerId)`, tên file, tên export là cố định.
      `source-fe/src/main.js`: thêm `import { chooseStatusClickKey } from
      './utils/chooseStatusClickKey.js';` ở đầu file; trong listener `click` của nút đổi trạng thái (dòng
      81-92), đổi đúng dòng hỏi guard thành:
      `if (!acceptStatusClick(chooseStatusClickKey(filterEl.value, button.dataset.statusId),
      event.timeStamp)) return;`.
      BẮT BUỘC:
      - `filterEl.value` được đọc TRONG listener, ở TỪNG lần bấm; không dùng lại giá trị của lần bấm trước
        hay của `refresh()`.
      - Dòng hỏi guard vẫn đứng TRƯỚC dòng xoá `#message` (REQ-004 D4 không đổi): lần bấm bị bỏ qua không
        đổi gì trên màn hình.
      - `updateCustomerStatus` vẫn nhận `button.dataset.statusId` và `button.dataset.targetStatus`; key của
        guard không đi vào yêu cầu gửi lên BE.
      - Vẫn một guard `acceptStatusClick` tạo một lần ở mức module (dòng 13); `src/utils/
        createDoubleClickGuard.js` và TC-108..TC-113 KHÔNG đổi.
      - Không đổi gì khác trong `main.js` ở task này (vùng xoá `#message` chung sáu chỗ, submit form thêm là
        việc của T6).
      Test: tạo `source-fe/test/chooseStatusClickKey.test.js`, import `chooseStatusClickKey` từ
      `../src/utils/chooseStatusClickKey.js` và `createDoubleClickGuard` (thật, không giả) từ
      `../src/utils/createDoubleClickGuard.js`.
      TC-137 (7 dòng `(statusFilter, customerId)`: `('', '7')`, `(undefined, '7')`, `(null, '7')`,
      `('', '')`, `('', 'constructor')`, `('', '__proto__')`, `('', '7"><b>x</b>')`): kết quả `===
      customerId` của đúng dòng đó (so `===`, không chỉ `==`).
      TC-138 (4 dòng `(statusFilter, customerId)`: `('ACTIVE', '1')`, `('ACTIVE', '2')`, `('INACTIVE', '2')`,
      `('INACTIVE', '')`): `typeof kết_quả !== 'string'` đúng cho cả bốn dòng; bốn kết quả bằng nhau (`===`)
      từng cặp; kết quả chung khác (`!==`) mọi `customerId` đã dùng (`'1'`, `'2'`, `''`).
      TC-139..TC-142: mỗi dòng dữ liệu tạo MỘT guard mới (`const accept = createDoubleClickGuard();`); mỗi
      lần bấm gọi `accept(chooseStatusClickKey(statusFilter, customerId), at)`; so từng kết quả theo đúng
      thứ tự bằng `assert.equal(..., true)` / `assert.equal(..., false)`.
      TC-139 (5 chuỗi lần bấm, biên bản bấm đúp khi đang lọc, mỗi chuỗi → `true`, `false`):
      `('ACTIVE','1',1000)`,`('ACTIVE','2',1000)`; `('ACTIVE','1',1000)`,`('ACTIVE','2',1001)`;
      `('ACTIVE','1',1000)`,`('ACTIVE','2',1499)`; `('ACTIVE','1',1000)`,`('ACTIVE','1',1300)`;
      `('INACTIVE','2',1000)`,`('INACTIVE','4',1499)`.
      TC-140 (3 chuỗi, biên 500 ms, mốc neo vào lần bấm ĐƯỢC XỬ LÝ):
      `('ACTIVE','1',1000)` → `true`;
      `('ACTIVE','1',1000)`,`('ACTIVE','3',1500)` → `true`,`true`;
      `('ACTIVE','1',1000)`,`('ACTIVE','3',1300)`,`('ACTIVE','3',1500)` → `true`,`false`,`true`.
      TC-141 (1 chuỗi, "Tất cả" vẫn theo từng khách hàng):
      `('','1',1000)`,`('','2',1001)`,`('','1',1002)` → `true`,`true`,`false`.
      TC-142 (3 chuỗi, ngoài tiền đề của AC-2/AC-3, Q3/D4):
      `('ACTIVE','1',1000)`,`('','1',1300)` → `true`,`true`;
      `('','1',1000)`,`('ACTIVE','2',1300)` → `true`,`true`;
      `('ACTIVE','1',1000)`,`('INACTIVE','2',1300)` → `true`,`false`.
      Mỗi dòng dữ liệu lặp bằng `for...of` trong một `test(...)` theo nhóm trên; không `describe`.
    allowed_files:
