tasks:
  - id: T1
    type: test
    title: be - insertByStatuses dùng dữ liệu chuẩn (F1)
    description: >-
      Nhóm BE-1 (design D7, F1 của aiws/work/REQ-005/05-review.md). Chỉ sửa helper `insertByStatuses` trong
      `source-be/src/test/java/com/example/crm/service/CustomerServiceTest.java` (dòng 817-824): thay dữ liệu
      giả `"Customer " + n` / `"customer" + n + "@example.com"` / `phone = null` bằng khách hàng thứ i của
      bảng bốn khách hàng chuẩn (`aiws/work/REQ-005/03-test-spec.md` -> Dữ liệu chung):
      1. Nguyen Van An, an@example.com, không số
      2. Tran Thi Binh, binh@example.com, 0912345678
      3. Le Van Cuong, cuong@example.com, 0987654321
      4. Pham Thi Dung, dung@example.com, không số
      Hình dạng gợi ý (02-design.md D7):
      ```
      private static final String[][] STANDARD_CUSTOMERS = {
        {"Nguyen Van An", "an@example.com", null},
        {"Tran Thi Binh", "binh@example.com", "0912345678"},
        {"Le Van Cuong", "cuong@example.com", "0987654321"},
        {"Pham Thi Dung", "dung@example.com", null}
      };

      private List<Customer> insertByStatuses(List<CustomerStatus> statuses) {
        List<Customer> inserted = new ArrayList<>();
        for (CustomerStatus status : statuses) {
          String[] customer = STANDARD_CUSTOMERS[inserted.size()];
          inserted.add(repository.insert(customer[0], customer[1], customer[2], status));
        }
        return inserted;
      }
      ```
      BẮT BUỘC:
      - Khách hàng thứ i mang tên/email/số của dòng i trong bảng trên và `status` thứ i của tham số nhận
        vào; chữ ký và kiểu trả về của `insertByStatuses` giữ nguyên.
      - Thân TC-117 (dòng 771-781), provider `statusListsForNoFilter` (dòng 783-788), thân TC-118
        (dòng 790-802), provider `statusListsWithOneFilterValue` (dòng 804-815), `@DisplayName`, tên
        method: KHÔNG đổi một ký tự. List mong đợi của hai test được dựng từ các `Customer` do
        `insertByStatuses` trả về nên không assertion nào phải sửa.
      - TC-119 (dòng 826-842) KHÔNG sửa: nó tự dựng kho K4 tại chỗ bằng dữ liệu chuẩn, không gọi
        `insertByStatuses`.
      - Sau khi sửa, hai chuỗi `"Customer "` và `"customer" + n` KHÔNG còn ở đâu trong file (phần (a) của
        AC-5 cho F1, reviewer đọc diff; không kiểm được bằng chạy test).
      - Không thêm dependency; không sửa file nào khác (không chạm `source-be/src/main/`).
      Sau khi sửa: trên kho K4 (`[ACTIVE, INACTIVE, ACTIVE, INACTIVE]`), kết quả lọc `INACTIVE` của TC-118 có
      phần tử `id` 2 mang `phone = "0912345678"` (không còn `null`), được so cả bản ghi qua
      `assertEquals(expected, result)` đang có — chứng minh helper mang đúng số điện thoại qua `insert`.
      Số lần chạy không đổi: TC-117 chạy 3 lần, TC-118 chạy 5 lần, `CustomerServiceTest` 173, toàn bộ BE 399,
      đều pass (`be_test`).
    allowed_files:
      - source-be/src/test/java/com/example/crm/service/CustomerServiceTest.java
    tests: [TC-117, TC-118]
    depends_on: []

