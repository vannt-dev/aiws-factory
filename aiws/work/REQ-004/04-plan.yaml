# REQ-004 — Plan. Mỗi task nhỏ: <= 10 file, có test riêng. Mọi TC trong 03-test-spec.md thuộc đúng 1 task.
# allowed_files: đường dẫn chính xác (hoặc glob hẹp) trong các thư mục source_paths, gồm cả file test,
#   đặt đúng cấu trúc hiện có của dự án (không tạo cấu trúc mới, không đổi tên/di chuyển file).
# type: loại commit theo Conventional Commits (feat | fix | refactor | perf | test | docs | build | chore...).
tasks:
  - id: T1
    type: test
    title: be - chuyển TC-92, TC-97 sang @MethodSource
    description: >-
      Trong CustomerHandlerTest.java, đổi @ValueSource(longs = {1, 2}) ở TC-92 và
      @ValueSource(strings = {...}) ở TC-97 sang @MethodSource với provider private static
      đặt ngay sau mỗi test (Stream<Long> cho TC-92, Stream<String> cho TC-97; giữ đúng 2 dòng
      dữ liệu của TC-92 và đúng 8 dòng theo thứ tự cũ của TC-97); xoá import
      org.junit.jupiter.params.provider.ValueSource vì không còn dùng. Giữ nguyên từng ký tự
      @DisplayName, tên method, chữ ký và thân của hai test. Không sửa gì khác trong file,
      không sửa file nào dưới source-be/src/main/.
