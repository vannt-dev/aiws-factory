  - id: T6
    type: feat
    title: fe - thêm form sửa khách hàng hiện lỗi theo từng trường và nối vào trang
    description: >-
      Nhóm FE-3 (design D10, D11, D12). Tạo `src/components/customerEditForm.js`: JSDoc một dòng,
      `export function renderCustomerEditForm(customer, fieldErrors = {})` là hàm thuần trả chuỗi HTML, import
      `escapeHtml` bằng đường dẫn tương đối có đuôi `.js`. HTML viết liền, không xuống dòng, đúng thứ tự thuộc tính:
      `<h2>Sửa khách hàng #{id}</h2><form id="edit-form" data-id="{id}" novalidate>`, rồi ba khối
      `<div class="field"><label for="edit-{field}">{nhãn}</label><input id="edit-{field}" name="{field}" type="{type}" value="{value}"></div>`
      cho `name`/`email`/`phone` với nhãn `Họ tên`/`Email`/`Điện thoại` và type `text`/`email`/`tel`, rồi
      `<button type="submit">Lưu</button><button type="button" data-cancel-edit>Huỷ</button></form>`.
      Trường có lỗi trong `fieldErrors` thì `<input>` thêm hai thuộc tính Ở CUỐI và phần tử lỗi ngay sau nó:
      `<input ... value="{value}" aria-invalid="true" aria-describedby="edit-{field}-error"><span id="edit-{field}-error" class="error" role="alert">{thông điệp}</span></div>`.
      Trường không có lỗi thì không có `aria-invalid` và không có phần tử `edit-{field}-error`. Key khác `name`,
      `email`, `phone` trong `fieldErrors` bị bỏ qua. MỌI giá trị động (`id` ở tiêu đề và `data-id`, ba `value`,
      thông điệp lỗi) đi qua `escapeHtml`. `phone` là `null`, thiếu field hoặc `''` cho `value=""`; số giữ dạng API
      trả, KHÔNG qua `formatPhone`, không dùng `NO_PHONE`. Thông điệp lỗi hiện nguyên văn tiếng Anh của API. Component
      không kiểm tra dữ liệu.
      `index.html`: thêm `<div id="edit-customer"></div>` giữa `#message` và `#customers`; thêm CSS
      `.field { display: flex; flex-direction: column; gap: .25rem; }`. `#create-form` không đổi.
      `src/main.js`: import `getCustomer`, `updateCustomer`, `renderCustomerEditForm`; lấy
      `editEl = document.getElementById('edit-customer')`; thêm ba xử lý sự kiện bằng delegation:
      (1) `click` trên `#customers`, phần tử khớp `button[data-edit-id]`: xoá `#message`, gọi `getCustomer(id)`, gán
      `editEl.innerHTML = renderCustomerEditForm(customer)`, focus ô nhập đầu tiên; lỗi thì `#message` hiện
      "Không tải được khách hàng." và vùng form giữ nguyên.
      (2) `submit` trên `#edit-customer`: `preventDefault()`, xoá `#message`, lấy `id` từ `form.dataset.id` và giá trị
      thô từ `new FormData(form)`, gọi `updateCustomer(id, { name, email, phone })`. Thành công: `editEl.innerHTML = ''`
      rồi `await refresh()`. `ApiError` có `fieldErrors` khác rỗng: gán
      `editEl.innerHTML = renderCustomerEditForm({ id, name, email, phone }, error.fieldErrors)` với giá trị vừa nhập,
      focus ô lỗi đầu tiên. Lỗi khác (404, 500, mất mạng): `#message` hiện "Không lưu được khách hàng.", form giữ
      nguyên giá trị đang nhập.
      (3) `click` trên `#edit-customer`, phần tử khớp `button[data-cancel-edit]`: `editEl.innerHTML = ''` và xoá
      `#message`.
      Thông báo gán bằng `textContent`. `refresh()` và submit handler của `#create-form` KHÔNG đổi; `main.js` không
      giữ state hay cache khách hàng, không tự chuẩn hoá hay kiểm tra dữ liệu.
      `src/api/customerApi.js` và `src/components/customerTable.js` CỐ Ý không nằm trong allowed_files (xong ở T4,
      T5); nếu thấy cần sửa thì ghi câu hỏi vào `aiws/work/REQ-002/questions.md` và dừng.
      Test: tạo `test/customerEditForm.test.js` với TC-76..TC-81 theo 03-test-spec.md (`node:test` +
      `node:assert/strict`, so chuỗi HTML; bảng dữ liệu là một mảng lặp bằng `for...of` trong MỘT `test(...)`; comment
      `// Arrange`, `// Act`, `// Assert` ở test đầu tiên của file). Tên test
      `test('TC-n: renderCustomerEditForm ...', ...)` bằng câu tiếng Anh. `index.html` và `main.js` không có seam
      unit test (không có DOM), được kiểm bằng review hoặc chạy tay theo mục "Không có TC tự động" của test spec.
    allowed_files:
