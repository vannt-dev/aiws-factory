      nhập). Lỗi non-2xx ném `ApiError` qua `request()`. `request`, `ApiError`, `API_BASE`, `listCustomers`,
      `createCustomer` KHÔNG sửa. Không gộp thêm và sửa thành một hàm `saveCustomer`.
      Test: thêm TC-70..TC-73 vào `test/customerApi.test.js` bằng `fakeFetch` có sẵn (bổ sung `getCustomer`,
