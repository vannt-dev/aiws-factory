# REQ-002 — Plan. Mỗi task nhỏ: <= 10 file, có test riêng. Mọi TC trong 03-test-spec.md thuộc đúng 1 task.
# allowed_files: đường dẫn chính xác (hoặc glob hẹp) trong các thư mục source_paths, gồm cả file test,
#   đặt đúng cấu trúc hiện có của dự án (không tạo cấu trúc mới, không đổi tên/di chuyển file).
# type: loại commit theo Conventional Commits (feat | fix | refactor | perf | test | docs | build | chore...).
#
# Chia theo nhóm biên dịch của 02-design.md (BE change -> BE-1/BE-2/BE-3, FE change -> FE-1/FE-2/FE-3) và bảng
# "Phân bổ TC theo file và nhóm task" của 03-test-spec.md. Sau mỗi task orchestrator chạy toàn bộ `be_test`
# hoặc `fe_test` của side bị chạm, nên mọi trạng thái trung gian phải biên dịch và pass cả test cũ: mỗi task
# BE chỉ thêm public API (T2 tách hàm private nhưng giữ nguyên chữ ký và hành vi của `create`), và TC-36 của
# REQ-001 được sửa trong chính task đổi `customerTable.js` (T5).
# Thứ tự: BE trước FE (design -> Migration: deploy BE trước, FE sau).
# TC-36 thuộc REQ-001, không được định nghĩa lại trong 03-test-spec.md của REQ-002, nên KHÔNG nằm trong `tests`
# của task nào (design D9).
#
# Re-plan sau review (05-review.md, 1 critical): T1..T6 đã DONE và giữ nguyên id, allowed_files, tests. T7 là
# task sửa cho finding D4 ở `CustomerService.java:46`. T7 không đổi hành vi quan sát được và không thêm hay sửa
# test, nên `tests: []`: TC-48..TC-60 vẫn thuộc T2; toàn bộ `be_test` chạy lại sau T7 là bằng chứng không hồi quy.
# Bốn finding minor của 05-review.md không có trong feedback của vòng này và không có task: để người review PR
# quyết định.
tasks:
  - id: T1
    type: feat
    title: be - thêm update và hai truy vấn trùng có loại trừ id vào repository
    description: >-
      Nhóm BE-1 (design D5, D6). Chỉ THÊM method, không đổi method cũ.
      `repository/CustomerRepository.java`: thêm ba method, mỗi method một dòng Javadoc như `insert`:
      `boolean existsByEmailAndIdNot(String email, long id)`,
      `boolean existsByPhoneAndStatusAndIdNot(String phone, CustomerStatus status, long id)`,
      `Optional<Customer> update(long id, String name, String email, String phone)`. Năm method cũ (`findAll`,
      `findById`, `existsByEmail`, `existsByPhoneAndStatus`, `insert`) giữ nguyên chữ ký và Javadoc.
      `repository/InMemoryCustomerRepository.java`: cài đặt ba method.
      `existsByEmailAndIdNot` là `anyMatch(c -> c.id() != id && c.email().equalsIgnoreCase(email))`.
      `existsByPhoneAndStatusAndIdNot` là `anyMatch(c -> c.id() != id && phone.equals(c.phone()) && c.status() == status)` —
      BẮT BUỘC viết `phone.equals(c.phone())`, không viết ngược, vì `c.phone()` có thể `null`. Cả hai duyệt toàn bộ
      kho, không tìm một bản ghi rồi so `id` (kho không có ràng buộc duy nhất, có thể có nhiều bản ghi cùng giá trị).
      `update` là `Optional.ofNullable(customers.computeIfPresent(id, (key, c) -> new Customer(c.id(), name, email, phone, c.status())))`:
      thay `name`, `email`, `phone` (kể cả ghi `null`), GIỮ NGUYÊN `id` và `status` đang lưu; `id` không có thì trả
      `Optional.empty()` và KHÔNG BAO GIỜ thêm mới. Không dùng `customers.put`/upsert, không đụng `sequence`; hàm
      truyền vào `computeIfPresent` phải thuần (`ConcurrentSkipListMap` có thể gọi lại nó khi có tranh chấp).
      Repository chỉ lưu đúng giá trị nhận được: không trim, không kiểm tra, không quyết định nghiệp vụ.
      Không sửa file nào khác: `CustomerService` chưa gọi ba method này (việc của T2); mọi test cũ phải biên dịch
      và pass không đổi.
      Test: thêm TC-44..TC-47 vào `InMemoryCustomerRepositoryTest.java` theo đúng preconditions và bảng dữ liệu
      trong 03-test-spec.md; TC-11, TC-12 giữ nguyên. Mỗi test tự tạo `InMemoryCustomerRepository` mới; thứ tự
      `insert` quyết định `id` (TC-47 chèn C có `phone = null` đầu tiên; TC-46 có hai khách hàng cùng
      `dup@example.com`; TC-45 chụp `findAll()` trước khi gọi `update`). Bảng dữ liệu dùng `@ParameterizedTest` +
      `@MethodSource`, provider `private static` đặt ngay sau test. `@DisplayName("TC-n: ...")` ở mức method bằng
      câu tiếng Anh; tên method camelCase, không chứa mã TC.
    allowed_files:
      - source-be/src/main/java/com/example/crm/repository/CustomerRepository.java
      - source-be/src/main/java/com/example/crm/repository/InMemoryCustomerRepository.java
      - source-be/src/test/java/com/example/crm/repository/InMemoryCustomerRepositoryTest.java
    tests: [TC-44, TC-45, TC-46, TC-47]
    depends_on: []

  - id: T2
    type: feat
    title: be - tách hàm kiểm tra dùng chung và thêm CustomerService.update
    description: >-
      Nhóm BE-2 (design D2 bước 3-5, D4, D7). `service/CustomerService.java`: tách khối kiểm tra của `create`
      (dòng 33-58) thành MỘT hàm private mà `create` và `update` cùng gọi, ví dụ
      `validate(name, email, phone, Predicate<String> emailTaken, Predicate<String> phoneTaken)` trả record private
      lồng trong class `ValidatedFields(String name, String email, String phone)` (`name`, `email` đã trim; `phone`
      đã chuẩn hoá hoặc `null`); tên hàm và record là gợi ý. Hàm chứa NGUYÊN khối kiểm tra hiện có, chỉ thay hai
      lệnh gọi repository bằng hai predicate. KHÔNG chép quy tắc sang `update`, không tách class validator, không
      thêm tham số `Long excludedId`, không gộp thành `save`.
      BẮT BUỘC giữ: thứ tự kiểm tra name -> email -> phone; nguyên văn năm thông điệp (`must not be blank`,
      `must be at most 100 characters`, `must be a valid email address`, `must be a valid phone number`,
      `is already used by another customer`); các field kiểm tra độc lập và gom vào một `ValidationException`;
      truy vấn trùng chỉ chạy khi giá trị đã qua kiểm tra định dạng; `phone` rỗng sau `PhoneNumbers.trim` thì bỏ
      qua mọi kiểm tra và là `null`.
      `create(String name, String email, String phone)` giữ chữ ký và hành vi: truyền `repository::existsByEmail` và
      `p -> repository.existsByPhoneAndStatus(p, CustomerStatus.ACTIVE)`, rồi `repository.insert(..., CustomerStatus.ACTIVE)`.
      Thêm `public Customer update(long id, String name, String email, String phone)`: gọi `get(id)` TRƯỚC khi kiểm
      tra dữ liệu (id không tồn tại -> `NotFoundException("Customer <id> not found")` kể cả khi dữ liệu sai); kiểm
      tra bằng `e -> repository.existsByEmailAndIdNot(e, id)` và
      `p -> repository.existsByPhoneAndStatusAndIdNot(p, CustomerStatus.ACTIVE, id)`; rồi
      `repository.update(id, name, email, phone).orElseThrow(() -> new NotFoundException("Customer " + id + " not found"))`.
      `update` KHÔNG đọc `status` của khách hàng đang sửa và không truyền `status` xuống thao tác ghi.
      KHÔNG "sửa" các hành vi legacy giữ có chủ ý (D7): (a) không gửi số thì số đang có bị xoá; (b) khách hàng
      `INACTIVE` vẫn sửa được và vẫn `INACTIVE`; (c) kiểm tra trùng số không xét trạng thái của khách hàng đang
      sửa; (d) mọi lần lưu đều kiểm tra lại số, kể cả khi số không đổi.
      `list`, `get`, `PhoneNumbers.java` và hai file repository (xong ở T1) không sửa.
      Test: thêm TC-48..TC-60 vào `CustomerServiceTest.java` theo đúng preconditions và bảng dữ liệu trong
      03-test-spec.md. Mỗi test tự dựng `InMemoryCustomerRepository` bằng `repository.insert(...)` theo đúng thứ tự
      của preconditions (thứ tự quyết định `id`) rồi tạo `new CustomerService(repository)` trên chính repository đó,
      như TC-25. Chèn ĐÚNG và CHỈ các khách hàng mà preconditions của từng TC liệt kê: Seed `ACTIVE` không có số là
      id 1 ở TC-48..TC-54 và TC-56..TC-60; TC-55 KHÔNG có Seed (B là id 1, A là id 2). Mỗi dòng dữ liệu chạy
      trên kho mới. "Không đổi gì" = `service.list()` bằng đúng danh sách chụp trước khi gọi; lỗi validation so cả
      map `errors()`. Bảng dữ liệu dùng `@ParameterizedTest` + `@MethodSource` (thêm `@NullSource` khi cần ca
      `null`); dòng có ký tự điều khiển (TC-50) dùng `name = ROW_NAME` có sẵn. `@DisplayName("TC-n: ...")` ở mức
      method. Test cũ (TC-13..TC-26 và 5 test không mã TC) KHÔNG sửa và phải pass: chúng bảo vệ việc tách hàm.
    allowed_files:
      - source-be/src/main/java/com/example/crm/service/CustomerService.java
      - source-be/src/test/java/com/example/crm/service/CustomerServiceTest.java
    tests: [TC-48, TC-49, TC-50, TC-51, TC-52, TC-53, TC-54, TC-55, TC-56, TC-57, TC-58, TC-59, TC-60]
    depends_on: [T1]

  - id: T3
    type: feat
    title: "be - thêm endpoint PUT /api/customers/{id} sửa khách hàng"
    description: >-
      Nhóm BE-3 (design D1, D2 bước 1-2, D3; api-contract.yaml -> `updateCustomer`). Tạo
      `api/UpdateCustomerRequest.java`: `public record UpdateCustomerRequest(String name, String email, String phone) {}`
      với Javadoc một dòng "Request body of PUT /api/customers/{id}."; không có `id`, không có `status`. Không dùng
      lại hay đổi tên `CreateCustomerRequest`.
      `api/CustomerHandler.java`: trong `route`, ngay sau nhánh `GET` của `BY_ID`, thêm nhánh
      `byId.matches() && method.equals("PUT")`: đọc body bằng
      `JSON.readValue(exchange.getRequestBody(), UpdateCustomerRequest.class)` TRƯỚC khi gọi service (JSON hỏng trả
      400 `Malformed JSON` kể cả khi `id` không tồn tại), rồi
      `send(exchange, 200, service.update(Long.parseLong(byId.group(1)), body.name(), body.email(), body.phone()))`.
      `id` chỉ lấy từ path; field lạ trong body (`id`, `status`) đã bị bỏ qua nhờ `FAIL_ON_UNKNOWN_PROPERTIES = false`.
      Cập nhật Javadoc của class để liệt kê `PUT /api/customers/{id}`. `handle`, `send`, `BY_ID`, `JSON` và ba route
      cũ không đổi; không thêm mã lỗi hay `title` mới (404 và 400 đi qua bảng map exception có sẵn).
      `PUT /api/customers`, `/abc`, `/-1` rơi vào fallback `No route for PUT <path>` có sẵn, không thêm nhánh nào.
      Không xử lý riêng `id` vượt `long` hay body JSON `null` (design R10) và không viết test cho hai đầu vào này.
      Không sửa: `CreateCustomerRequest.java`, `Problem.java`, `App.java`, `CustomerService.java`, repository.
      Test: thêm TC-61..TC-69 vào `CustomerHandlerTest.java` theo đúng dữ liệu trong 03-test-spec.md. Thêm helper
      `put(String path, String json)` theo mẫu `post` (URL `baseUrl + path`, header `Content-Type: application/json`,
      `.PUT(HttpRequest.BodyPublishers.ofString(json))`); TC-69 gọi cả path rỗng (`PUT /api/customers`). Server và
      seed id 1 lấy từ `@BeforeEach` có sẵn; khách hàng id 2 tạo bằng `post(...)`. Parse response bằng
      `CustomerHandler.JSON.readTree`. "Không đổi gì" = body của `GET /api/customers` (so `JsonNode`) bằng đúng body
      chụp trước yêu cầu. Bảng dữ liệu dùng `@ParameterizedTest(name = "[{index}]")` + `@MethodSource` như các test
      hiện có trong file. `@DisplayName("TC-n: ...")` ở mức method. Test cũ không sửa.
    allowed_files:
      - source-be/src/main/java/com/example/crm/api/UpdateCustomerRequest.java
      - source-be/src/main/java/com/example/crm/api/CustomerHandler.java
      - source-be/src/test/java/com/example/crm/api/CustomerHandlerTest.java
    tests: [TC-61, TC-62, TC-63, TC-64, TC-65, TC-66, TC-67, TC-68, TC-69]
    depends_on: [T2]

  - id: T4
    type: feat
    title: fe - thêm getCustomer và updateCustomer vào customerApi
    description: >-
      Nhóm FE-1 (design D8; api-contract.yaml -> `getCustomer`, `updateCustomer`). `src/api/customerApi.js`: thêm hai
      hàm public đi qua `request()` có sẵn, mỗi hàm một dòng JSDoc `/** ... */`:
      `getCustomer(id, options)` trả `request('/customers/' + encodeURIComponent(id), options)` (không `method`, không
