      - source-fe/src/components/customerTable.js
      - source-fe/test/formatPhone.test.js
      - source-fe/test/customerTable.test.js
    tests: [TC-33, TC-34, TC-35, TC-36, TC-37, TC-38, TC-39, TC-40, TC-41]
