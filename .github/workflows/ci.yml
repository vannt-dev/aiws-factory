name: CI

# Staged pipeline, cheapest first; every stage runs only if the previous one passed:
#   1. lint        - ESLint + Prettier, once (OS/Node independent)
#   2. test-linux  - full test suite on Linux, minimum Node (22): catches logic errors fast
#   3. test-matrix - Windows and macOS (Node 22) + Linux on the current LTS (Node 24)
#   4. ci-result   - single status to require in branch protection
#
# Runs only when something the CLI or its tests depend on changes (the tests copy the aiws/ kit
# and AGENTS.md). Docs-only, landing-page and aiws/work changes do not start CI.
on:
  push:
    branches: [main]
    paths:
      - "aiws/adapters/cli/**"
      - "aiws/config/**"
      - "aiws/agents/**"
      - "aiws/skills/**"
      - "aiws/templates/**"
      - "AGENTS.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "aiws/adapters/cli/**"
      - "aiws/config/**"
      - "aiws/agents/**"
      - "aiws/skills/**"
      - "aiws/templates/**"
      - "AGENTS.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: aiws/adapters/cli

jobs:
  lint:
    name: 1. Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test-linux:
    name: 2. Test (Linux, Node 22)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      # tests need only runtime dependencies; ESLint and Prettier are skipped
      - run: npm ci --omit=dev
      - run: npm test

  test-matrix:
    name: 3. Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: test-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      - run: npm ci --omit=dev
      - run: npm test

  ci-result:
    name: 4. CI result
    if: always()
    needs: [lint, test-linux, test-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All stages passed
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "stage results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::a CI stage did not succeed ($r)"; exit 1; fi
          done
