name: CI

# Staged pipeline, cheapest first; every stage runs only if the previous one passed:
#   0. changes     - decides whether the CLI or its test inputs changed (seconds)
#   1. lint        - ESLint + Prettier, once (OS/Node independent)
#   2. test-linux  - full test suite on Linux, minimum Node (22): catches logic errors fast
#   3. test-matrix - Windows and macOS (Node 22) + Linux on the current LTS (Node 24)
#   4. ci-result   - the single required status for branch protection
#
# The workflow always starts, so "4. CI result" is always reported. When only docs, the landing page
# or aiws/work change, stages 1-3 are skipped and stage 4 passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: aiws/adapters/cli

jobs:
  changes:
    name: 0. Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.diff.outputs.cli }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        name: Files that affect the CLI or its tests
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # the tests copy the aiws/ kit and AGENTS.md, so those count as CLI inputs
          pattern='^(aiws/adapters/cli/|aiws/config/|aiws/agents/|aiws/skills/|aiws/templates/|AGENTS\.md$|\.github/workflows/ci\.yml$)'
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "full run ($EVENT, base '$BASE')"
            echo "cli=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -Eq "$pattern"; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "no CLI or kit changes: stages 1-3 will be skipped"
            echo "cli=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: 1. Lint and format
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test-linux:
    name: 2. Test (Linux, Node 22)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      # tests need only runtime dependencies; ESLint and Prettier are skipped
      - run: npm ci --omit=dev
      - run: npm test

  test-matrix:
    name: 3. Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: test-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      - run: npm ci --omit=dev
      - run: npm test

  ci-result:
    name: 4. CI result
    if: always()
    needs: [changes, lint, test-linux, test-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Evaluate stages
        env:
          CHANGES: ${{ needs.changes.result }}
          CLI: ${{ needs.changes.outputs.cli }}
          STAGES: ${{ needs.lint.result }} ${{ needs.test-linux.result }} ${{ needs.test-matrix.result }}
        run: |
          echo "changes=$CHANGES cli=$CLI stages: $STAGES"
          if [ "$CHANGES" != "success" ]; then echo "::error::change detection did not succeed"; exit 1; fi
          if [ "$CLI" != "true" ]; then echo "no CLI or kit changes: nothing to verify"; exit 0; fi
          for r in $STAGES; do
            if [ "$r" != "success" ]; then echo "::error::a CI stage did not succeed ($r)"; exit 1; fi
          done
          echo "all stages passed"
