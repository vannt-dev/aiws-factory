name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: aiws/adapters/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  aiws-gates:
    # Re-checks the AIWS gates on pull requests opened from aiws/REQ-* branches.
    name: AIWS gates
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'aiws/REQ-')
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      - run: npm ci
        working-directory: aiws/adapters/cli
      - name: Resolve requirement id
        run: |
          req="${HEAD_REF#aiws/}"
          echo "REQ=${req%-knowledge}" >> "$GITHUB_ENV"
      - name: Commit trailers
        run: node aiws/adapters/cli/bin/aiws.js check commit-trailer --req "$REQ"
      - name: Approvals
        run: node aiws/adapters/cli/bin/aiws.js check approvals --req "$REQ"
      - name: Traceability
        run: node aiws/adapters/cli/bin/aiws.js trace "$REQ"
