name: AIWS gates

# Re-checks the AIWS gates on pull requests opened from aiws/REQ-* branches by the orchestrator:
# commit trailers, signed/valid approvals, the AC -> TC -> task -> commit trace, and the project's
# own build and tests (the <side>_build / <side>_test commands of aiws/config/policies.yaml).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: aiws-gates-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: AIWS gates
    if: startsWith(github.head_ref, 'aiws/REQ-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      - run: npm ci --omit=dev
        working-directory: aiws/adapters/cli
      - name: Resolve requirement id
        run: |
          req="${HEAD_REF#aiws/}"
          echo "REQ=${req%-knowledge}" >> "$GITHUB_ENV"
      - name: Commit trailers
        run: node aiws/adapters/cli/bin/aiws.js check commit-trailer --req "$REQ"
      - name: Approvals
        run: node aiws/adapters/cli/bin/aiws.js check approvals --req "$REQ"
      - name: Traceability
        run: node aiws/adapters/cli/bin/aiws.js trace "$REQ"

      # Toolchains for the project's own commands. Node.js is set up above; ubuntu-latest also ships
      # .NET, Go, Python, PHP, Ruby and Rust. Add or pin what your stack needs. Each step only runs
      # when a matching project exists under source-*, so other stacks and the kit itself are unaffected.
      - name: Set up Java (Maven or Gradle project)
        if: hashFiles('source-*/pom.xml', 'source-*/build.gradle', 'source-*/build.gradle.kts') != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # adjust to the version your project targets
      - name: Project build and tests
        run: node aiws/adapters/cli/bin/aiws.js check build
