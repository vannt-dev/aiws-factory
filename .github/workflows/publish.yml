name: Publish to npm

# Publishes aiws/adapters/cli to npm as `aiws-factory` (the command stays `aiws`; npm refuses the name
# `aiws` as too similar to existing packages) with provenance, through npm trusted publishing: npmjs.com
# trusts this repository and this workflow file, so no token lives in the repository. Runs on every
# release tag (`v*`, which must equal the package version) and by hand as a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and check only; publish nothing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: aiws/adapters/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: aiws/adapters/cli/package-lock.json
      # trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - name: The tag, if any, must be the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF#refs/tags/v}" = "$version" || { echo "tag $GITHUB_REF is not v$version"; exit 1; }
      - name: Pack (the kit is bundled by prepack) and list the tarball
        run: |
          npm pack --json > pack.json
          # postpack removes kit/ from the tree again, so the tarball listing is what is checked
          node -e "const p=require('./pack.json')[0];console.log(p.filename, p.size, 'bytes,', p.entryCount, 'files');for(const f of p.files)console.log(' ', f.path);if(!p.files.some(f=>f.path==='kit/config/workflow.yaml'))process.exit(1)"
      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish --provenance --access public
